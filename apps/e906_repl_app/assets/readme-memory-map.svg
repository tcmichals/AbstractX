<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470.8" width="680" height="470.8" role="img" aria-labelledby="t d">
<title id="t">RemoteProc memory carveouts (high address at top)</title>
<desc id="d">In the flight-stack overlay, a 1 MB DRAM carveout at 0x48100000 is reserved but unused by AbstractX firmware; the 1 MB DDR pool at 0x48000000 holds the VirtIO vrings and RPMsg buffers that Linux allocates; MCU SRAM Space 0 at host 0x07280000 (E906 view 0x3FFC0000) holds the firmware text, data and BSS.</desc>
<defs>
<marker id="a42d8f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42d8f5"/></marker>
