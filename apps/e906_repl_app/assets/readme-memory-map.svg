<rect width="100%" height="100%" rx="18" fill="#0f1a30"/>
<text x="30" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f2f6ff" text-anchor="start">RemoteProc memory carveouts (high address at top)</text>
<rect x="30" y="94" width="620" height="80" rx="12" fill="#151f33" stroke="#64748b" stroke-width="2"/>
<text x="340" y="130" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">DRAM carveout (reserved, unused)</text>
<text x="340" y="151" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle"><tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x48100000</tspan> - <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x48200000</tspan> (1 MB, rproc_dram); no firmware section here</text>
<rect x="30" y="186" width="620" height="80" rx="12" fill="#122b22" stroke="#4ade80" stroke-width="2"/>
<text x="340" y="213.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">RPMsg DMA pool (Linux)</text>
<text x="340" y="234.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle"><tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x48000000</tspan> - <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x48100000</tspan> (1 MB, rproc_vdev shared-dma-pool)</text>
<text x="340" y="251.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">vrings + 512 B buffers; E906 reaches them via <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">translate_buf()</tspan></text>
<rect x="30" y="278" width="620" height="34" rx="12" fill="#151f33" stroke="#64748b" stroke-width="2"/>
<text x="340" y="299.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">...</text>
<rect x="30" y="342.4" width="620" height="98.4" rx="12" fill="#122b22" stroke="#4ade80" stroke-width="2"/>
<text x="340" y="370.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">MCU SRAM Space 0 (firmware)</text>
<text x="340" y="391.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Text + Data + BSS (Zero-Heap Executable)</text>
<text x="340" y="408.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">host <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x07280000</tspan> - <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x072C0000</tspan> (256 KB, riscvsram0)</text>
<text x="340" y="425.6" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">E906 view <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x3FFC0000</tspan> - <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">0x3FFFFFFF</tspan></text>
</svg>
