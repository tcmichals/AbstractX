<title id="t">Observability pipeline - the three pillars</title>
<desc id="d">Pillar 1, the unified 64-byte TLP bus, feeds Pillar 2, the dynamic CTF 1.8 schema loader, over UDP port 9870 or shared SRAM; the loader feeds typed field dictionaries and metrics to Pillar 3, the two-level Studio GUI.</desc>
