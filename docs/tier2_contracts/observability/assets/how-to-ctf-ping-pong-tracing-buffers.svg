<title id="t">CTF 1.8 ping-pong trace buffers</title>
<desc id="d">Producers fill Buffer A (1024 bytes); on buffer full or the 10 ms swap it becomes Buffer B, which trace_dispatcher_task() transmits to the UDP, file or shared-SRAM trace sink.</desc>
