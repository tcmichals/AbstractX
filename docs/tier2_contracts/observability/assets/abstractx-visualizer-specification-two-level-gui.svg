<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 712.5" width="792" height="712.5" role="img" aria-labelledby="t d">
<title id="t">Two-level GUI architecture</title>
<desc id="d">AbstractX Studio (imgui-bundle) holds Level 1, the core framework layer standard across all apps, and Level 2, the user and domain extensible layer of pluggable app modules such as the gps_imu_app flight plugin.</desc>
