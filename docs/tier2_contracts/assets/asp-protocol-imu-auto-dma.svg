<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 404" width="1026" height="404" role="img" aria-labelledby="t d">
<title id="t">IMU SPI Master and Auto-DMA dataflow</title>
<desc id="d">The IMU_INT trigger pin starts the SPI master burst engine, whose accel and gyro bytes go to the 64-byte TLP packetizer with timestamping, which feeds the host transport FIFO.</desc>
