<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 224" width="1020" height="224" role="img" aria-labelledby="t d">
<title id="t">asp_spi_frontend shift-register seam</title>
<desc id="d">SPI pins SCLK, CS_N, IO0 and IO1 enter asp_spi_frontend (512-bit fixed shift register and parallel CRC32 engine), which presents a 64-byte TLP on the AXIS / Wishbone seam as tdata[511:0] with tvalid, tready and tlast.</desc>
