<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 632" width="1170" height="632" role="img" aria-labelledby="t d">
<title id="t">AbstractX: accelerators run the buses, the rest of the system sees results</title>
<desc id="d">Sensors and actuators are driven only by an I/O accelerator on each platform (Pico 2 W core 0 with PIO and DMA, an ESP32-P4 core with GDMA, the XuanTie E906 on the Cubie A5E, the pio2 PIO fabric on a Zynq or Tang Nano FPGA). Each accelerator hands finished samples through a ring to the consumer (the other MCU core, Linux over RPMsg or UIO rings, or the SPI-link host). Linux never drives a sensor bus. Only the E906 path is built and measured today.</desc>
