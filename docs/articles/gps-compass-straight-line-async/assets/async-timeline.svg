<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual asynchronous sensor timeline</title>
  <desc id="desc">GPS bytes and compass I2C transactions happen at different rates. The application suspends on one event and can process the other when it completes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131d34"/>
      <stop offset="1" stop-color="#090f1d"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8092b8"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .head { fill:#f4f7ff; font-size:18px; font-weight:800; }
      .muted { fill:#aebcda; font-size:14px; }
      .tiny { fill:#8292b2; font-size:12px; }
    </style>
  </defs>
  <rect width="1200" height="480" rx="26" fill="url(#bg)"/>
  <text x="48" y="52" fill="#48d9f4" font-size="14" font-weight="800" letter-spacing="2">WHY ASYNC HELPS</text>
  <text x="48" y="84" class="head">Each device keeps its own rhythm. The application reacts to events.</text>

  <text x="48" y="153" class="head">GPS / UART</text>
  <text x="48" y="177" class="muted">continuous bytes</text>
  <line x1="230" y1="160" x2="1138" y2="160" stroke="#42d8f5" stroke-width="2" opacity=".45"/>
  <rect x="270" y="137" width="135" height="46" rx="12" fill="#123848" stroke="#42d8f5"/>
  <text x="337" y="166" text-anchor="middle" fill="#b4f5ff" font-size="14" font-weight="700">byte chunk</text>
  <rect x="550" y="137" width="135" height="46" rx="12" fill="#123848" stroke="#42d8f5"/>
  <text x="617" y="166" text-anchor="middle" fill="#b4f5ff" font-size="14" font-weight="700">byte chunk</text>
  <rect x="912" y="137" width="150" height="46" rx="12" fill="#123848" stroke="#42d8f5"/>
  <text x="987" y="166" text-anchor="middle" fill="#b4f5ff" font-size="14" font-weight="700">valid GPS fix</text>

  <text x="48" y="250" class="head">Compass / I2C</text>
  <text x="48" y="274" class="muted">sample on demand</text>
  <line x1="230" y1="257" x2="1138" y2="257" stroke="#b79cff" stroke-width="2" opacity=".45"/>
  <rect x="340" y="234" width="150" height="46" rx="12" fill="#2a2041" stroke="#b79cff"/>
  <text x="415" y="263" text-anchor="middle" fill="#e0d6ff" font-size="14" font-weight="700">I2C transfer</text>
  <rect x="510" y="234" width="132" height="46" rx="12" fill="#2a2041" stroke="#b79cff"/>
  <text x="576" y="263" text-anchor="middle" fill="#e0d6ff" font-size="14" font-weight="700">heading ready</text>
  <rect x="770" y="234" width="150" height="46" rx="12" fill="#2a2041" stroke="#b79cff"/>
  <text x="845" y="263" text-anchor="middle" fill="#e0d6ff" font-size="14" font-weight="700">I2C transfer</text>
  <rect x="940" y="234" width="132" height="46" rx="12" fill="#2a2041" stroke="#b79cff"/>
  <text x="1006" y="263" text-anchor="middle" fill="#e0d6ff" font-size="14" font-weight="700">heading ready</text>

  <text x="48" y="348" class="head">Coroutine app</text>
  <text x="48" y="372" class="muted">linear code, event-driven waits</text>
  <line x1="230" y1="355" x2="1138" y2="355" stroke="#f8c768" stroke-width="2" opacity=".4"/>
  <rect x="270" y="332" width="135" height="46" rx="12" fill="#392f1d" stroke="#f8c768"/>
  <text x="337" y="361" text-anchor="middle" fill="#ffe6a8" font-size="14" font-weight="700">co_await UART</text>
  <rect x="510" y="332" width="132" height="46" rx="12" fill="#392f1d" stroke="#f8c768"/>
  <text x="576" y="361" text-anchor="middle" fill="#ffe6a8" font-size="14" font-weight="700">handle heading</text>
  <rect x="912" y="332" width="150" height="46" rx="12" fill="#392f1d" stroke="#f8c768"/>
  <text x="987" y="361" text-anchor="middle" fill="#ffe6a8" font-size="14" font-weight="700">handle GPS fix</text>

  <path d="M415 286 C415 307 415 312 415 326" fill="none" stroke="#8092b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M576 187 C576 205 576 212 576 228" fill="none" stroke="#8092b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <path d="M987 189 C987 249 987 276 987 326" fill="none" stroke="#8092b8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <line x1="230" y1="417" x2="1138" y2="417" stroke="#8092b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="448" class="tiny">TIME</text>
  <text x="1138" y="448" text-anchor="end" class="tiny">Conceptual timing only — not a benchmark or measured latency.</text>
</svg>
