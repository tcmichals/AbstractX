<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three AbstractX deployment paths</title>
  <desc id="desc">A conceptual comparison of Pico 2 W, Linux-only host, and Linux plus FPGA deployment paths, all leading to AbstractX Studio over UDP but with different I/O backends and validation status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121d36"/>
      <stop offset="1" stop-color="#090f1c"/>
    </linearGradient>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .title { fill:#fff; font-size:29px; font-weight:800; }
      .card-title { fill:#fff; font-size:19px; font-weight:800; }
      .body { fill:#c1cce2; font-size:14px; }
      .block-title { fill:#f4f7ff; font-size:14px; font-weight:750; }
      .block-sub { fill:#afbdd8; font-size:12px; }
      .status { font-size:12px; font-weight:750; }
    </style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="48" y="54" fill="#49d9f4" font-size="13" font-weight="800" letter-spacing="2">THREE PLATFORMS • THREE I/O PATHS</text>
  <text x="48" y="96" class="title">Same async idea. Different places for the I/O.</text>
  <text x="48" y="124" class="body">This is an architecture map—not a benchmark and not a claim that every path is hardware-validated.</text>

  <rect x="42" y="158" width="356" height="390" rx="20" fill="#122238" stroke="#42d8f5" stroke-width="1.5"/>
  <text x="66" y="195" fill="#42d8f5" font-size="12" font-weight="800" letter-spacing="1.4">MICROCONTROLLER</text>
  <text x="66" y="224" class="card-title">Pico 2 W</text>
  <rect x="66" y="247" width="308" height="57" rx="11" fill="#102e40" stroke="#2d6678"/>
  <text x="86" y="271" class="block-title">On-board UART + I2C</text>
  <text x="86" y="290" class="block-sub">GPS serial • compass sensor bus</text>
  <path d="M220 307 V327" stroke="#42d8f5" stroke-width="2"/>
  <rect x="66" y="329" width="308" height="66" rx="11" fill="#192a47" stroke="#4a628f"/>
  <text x="86" y="355" class="block-title">AbstractX C++20 application</text>
  <text x="86" y="376" class="block-sub">coroutines await peripheral events</text>
  <path d="M220 398 V418" stroke="#42d8f5" stroke-width="2"/>
  <rect x="66" y="420" width="308" height="54" rx="11" fill="#332b1c" stroke="#806a3e"/>
  <text x="86" y="453" fill="#ffe3a0" font-size="14" font-weight="750">Wi-Fi UDP telemetry :9870</text>
  <rect x="66" y="490" width="308" height="36" rx="10" fill="#142d3c"/>
  <text x="220" y="513" text-anchor="middle" fill="#8eeaff" class="status">GPS + compass-only firmware: in progress</text>

  <rect x="422" y="158" width="356" height="390" rx="20" fill="#19233a" stroke="#9aaed8" stroke-width="1.5"/>
  <text x="446" y="195" fill="#b5c8ee" font-size="12" font-weight="800" letter-spacing="1.4">LINUX OS</text>
  <text x="446" y="224" class="card-title">Linux-only host</text>
  <rect x="446" y="247" width="308" height="57" rx="11" fill="#202b43" stroke="#566784"/>
  <text x="466" y="271" class="block-title">Linux POSIX target</text>
  <text x="466" y="290" class="block-sub">standard scheduler or PREEMPT_RT kernel</text>
  <path d="M600 307 V327" stroke="#aebcdf" stroke-width="2"/>
  <rect x="446" y="329" width="308" height="66" rx="11" fill="#192a47" stroke="#4a628f"/>
  <text x="466" y="355" class="block-title">AbstractX C++20 application</text>
  <text x="466" y="376" class="block-sub">same cooperative application structure</text>
  <path d="M600 398 V418" stroke="#aebcdf" stroke-width="2"/>
  <rect x="446" y="420" width="308" height="54" rx="11" fill="#332b1c" stroke="#806a3e"/>
  <text x="466" y="453" fill="#ffe3a0" font-size="14" font-weight="750">Loopback UDP telemetry :9870</text>
  <rect x="446" y="490" width="308" height="36" rx="10" fill="#263044"/>
  <text x="600" y="513" text-anchor="middle" fill="#d0dcf6" font-size="11" font-weight="750">Host build verified • PREEMPT_RT: not measured</text>

  <rect x="802" y="158" width="356" height="390" rx="20" fill="#211d39" stroke="#bd9eff" stroke-width="1.5"/>
  <text x="826" y="195" fill="#cbb8ff" font-size="12" font-weight="800" letter-spacing="1.4">HETEROGENEOUS I/O</text>
  <text x="826" y="224" class="card-title">Linux AbstractX + FPGA</text>
  <rect x="826" y="247" width="308" height="57" rx="11" fill="#302344" stroke="#624d81"/>
  <text x="846" y="271" class="block-title">FPGA X-Fabric</text>
  <text x="846" y="290" class="block-sub">64-byte TLP routing • hardware I/O path</text>
  <path d="M980 307 V327" stroke="#bd9eff" stroke-width="2"/>
  <rect x="826" y="329" width="308" height="66" rx="11" fill="#192a47" stroke="#4a628f"/>
  <text x="846" y="355" class="block-title">Linux AbstractX application</text>
  <text x="846" y="376" class="block-sub">consumes completions / emits telemetry</text>
  <path d="M980 398 V418" stroke="#bd9eff" stroke-width="2"/>
  <rect x="826" y="420" width="308" height="54" rx="11" fill="#332b1c" stroke="#806a3e"/>
  <text x="846" y="453" fill="#ffe3a0" font-size="14" font-weight="750">Studio UDP telemetry :9870</text>
  <rect x="826" y="490" width="308" height="36" rx="10" fill="#302344"/>
  <text x="980" y="513" text-anchor="middle" fill="#e1d5ff" class="status">Target-specific validation required</text>

  <rect x="42" y="567" width="1116" height="30" rx="9" fill="#111a2d"/>
  <text x="600" y="587" text-anchor="middle" fill="#91a1bf" font-size="12">AbstractX Studio can observe UDP streams; identical UI does not imply identical hardware, code maturity, or performance.</text>
</svg>
