<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 491" width="1004" height="491" role="img">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .tag { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; fill: #49d9f4; }
      .title { font-size: 18px; font-weight: 700; fill: #f4f7ff; }
      .th { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; fill: #73e5fb; text-transform: uppercase; }
      .cell { font-size: 13px; fill: #c0cbe0; }
      .cell-bold { font-size: 13px; font-weight: 700; fill: #f4f7ff; }
      .cell-mono { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #8ee3fb; }
      .cell-accent { font-size: 13px; font-weight: 700; fill: #8ff0c0; }
    </style>
  </defs>
  <rect width="1004" height="491" rx="18" fill="#10192c" stroke="#1f2d47" stroke-width="1.5"/>
  <text x="32" y="32" class="tag">EMPIRICAL VALIDATION • RADXA CUBIE A5E HARDWARE RUNS (200 MHZ)</text>
  <text x="32" y="56" class="title">Silicon Benchmark Measurements: Bare Metal vs FreeRTOS</text>
  <rect x="32" y="75" width="940" height="380" rx="10" fill="#131d31" stroke="#253754" stroke-width="1.5"/>
  <path d="M 32 85 Q 32 75 42 75 H 962 Q 972 75 972 85 V 113 H 32 Z" fill="#1c2b46"/>
  <line x1="32" y1="113" x2="972" y2="113" stroke="#2d4263" stroke-width="1.5"/>
  <text x="46" y="99" class="th">Benchmark Metric</text>
  <text x="306" y="99" class="th">Bare Metal + AbstractX</text>
  <text x="646" y="99" class="th">FreeRTOS + AbstractX</text>
  <rect x="32" y="113" width="940" height="38" fill="#141f36"/>
  <line x1="32" y1="151" x2="972" y2="151" stroke="#233554" stroke-width="1"/>
  <text x="46" y="136" class="cell-bold">Yield round trip (cycles / ns)</text>
  <text x="306" y="136" class="cell-mono">1,930–1,961 cycles (9.65–9.81 µs)</text>
  <text x="646" y="136" class="cell-mono">1,979–1,997 cycles (9.90–9.99 µs)</text>
  <rect x="32" y="151" width="940" height="38" fill="#182540"/>
  <line x1="32" y1="189" x2="972" y2="189" stroke="#233554" stroke-width="1"/>
  <text x="46" y="174" class="cell-bold">Soft IRQ -&gt; ISR entry</text>
  <text x="306" y="174" class="cell-mono">370–416 cycles (1.85–2.08 µs)</text>
  <text x="646" y="174" class="cell-mono">175–222 cycles (0.88–1.11 µs)</text>
  <rect x="32" y="189" width="940" height="38" fill="#141f36"/>
  <line x1="32" y1="227" x2="972" y2="227" stroke="#233554" stroke-width="1"/>
  <text x="46" y="212" class="cell-bold">Soft IRQ -&gt; coroutine resumed</text>
  <text x="306" y="212" class="cell-mono">3,179–3,255 cycles (15.89–16.28 µs)</text>
  <text x="646" y="212" class="cell-mono">2,481–2,537 cycles (12.41–12.69 µs)</text>
  <rect x="32" y="227" width="940" height="38" fill="#182540"/>
  <line x1="32" y1="265" x2="972" y2="265" stroke="#233554" stroke-width="1"/>
  <text x="46" y="250" class="cell-bold">RPMsg echo 16 B (med / p99)</text>
  <text x="306" y="250" class="cell-mono">100.8 µs / 173.1 µs</text>
  <text x="646" y="250" class="cell-mono">111.2 µs / 168.9 µs</text>
  <rect x="32" y="265" width="940" height="38" fill="#141f36"/>
  <line x1="32" y1="303" x2="972" y2="303" stroke="#233554" stroke-width="1"/>
  <text x="46" y="288" class="cell-bold">RPMsg echo 256 B (med / p99)</text>
  <text x="306" y="288" class="cell-mono">232.9 µs / 293.6 µs</text>
  <text x="646" y="288" class="cell-mono">228.6 µs / 255.7 µs</text>
  <rect x="32" y="303" width="940" height="38" fill="#182540"/>
  <line x1="32" y1="341" x2="972" y2="341" stroke="#233554" stroke-width="1"/>
  <text x="46" y="326" class="cell-bold">RPMsg echo 496 B (med / p99)</text>
  <text x="306" y="326" class="cell-mono">328.7 µs / 377.9 µs</text>
  <text x="646" y="326" class="cell-mono">320.0 µs / 359.8 µs</text>
  <rect x="32" y="341" width="940" height="38" fill="#141f36"/>
  <line x1="32" y1="379" x2="972" y2="379" stroke="#233554" stroke-width="1"/>
  <text x="46" y="364" class="cell-bold">RPMsg throughput (496 B)</text>
  <text x="306" y="364" class="cell-mono">198,570 Bytes/sec (~198.6 KB/s)</text>
  <text x="646" y="364" class="cell-mono">2,976,453 Bytes/sec (~2.98 MB/s)</text>
  <rect x="32" y="379" width="940" height="38" fill="#182540"/>
  <line x1="32" y1="417" x2="972" y2="417" stroke="#233554" stroke-width="1"/>
  <text x="46" y="402" class="cell-bold">Idle wake-ups / second</text>
  <text x="306" y="402" class="cell-mono">0 (event-driven wfi)</text>
  <text x="646" y="402" class="cell-mono">4,514 wakes over run (1000 Hz CLINT tick)</text>
  <rect x="32" y="417" width="940" height="38" fill="#141f36"/>
  <line x1="32" y1="455" x2="972" y2="455" stroke="#233554" stroke-width="1"/>
  <text x="46" y="440" class="cell-bold">Busy share of run</text>
  <text x="306" y="440" class="cell-mono">not instrumented</text>
  <text x="646" y="440" class="cell-mono">5.5% (whole run incl. bench)</text>
</svg>
