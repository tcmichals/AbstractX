<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 467" width="1004" height="467" role="img">
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .tag { font-size: 11px; font-weight: 800; letter-spacing: 1.2px; fill: #49d9f4; }
      .title { font-size: 18px; font-weight: 700; fill: #f4f7ff; }
      .th { font-size: 11px; font-weight: 800; letter-spacing: 0.8px; fill: #73e5fb; text-transform: uppercase; }
      .cell { font-size: 13px; fill: #c0cbe0; }
      .cell-bold { font-size: 13px; font-weight: 700; fill: #f4f7ff; }
      .cell-mono { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #8ee3fb; }
      .cell-accent { font-size: 13px; font-weight: 700; fill: #8ff0c0; }
    </style>
  </defs>
  <rect width="1004" height="467" rx="18" fill="#10192c" stroke="#1f2d47" stroke-width="1.5"/>
  <text x="32" y="32" class="tag">MEMORY BUDGET • ALLWINNER T527 ON-CHIP FAST SRAM (192 KB SPACE 0)</text>
  <text x="32" y="56" class="title">Static Memory &amp; Stack Allocation Breakdown</text>
  <rect x="32" y="75" width="940" height="356" rx="10" fill="#131d31" stroke="#253754" stroke-width="1.5"/>
  <path d="M 32 85 Q 32 75 42 75 H 962 Q 972 75 972 85 V 113 H 32 Z" fill="#1c2b46"/>
  <line x1="32" y1="113" x2="972" y2="113" stroke="#2d4263" stroke-width="1.5"/>
  <text x="46" y="99" class="th">Memory Segment</text>
  <text x="266" y="99" class="th">Bare Metal + AbstractX</text>
  <text x="506" y="99" class="th">FreeRTOS + AbstractX</text>
  <text x="746" y="99" class="th">Delta &amp; Architectural Analysis</text>
  <rect x="32" y="113" width="940" height="56" fill="#141f36"/>
  <line x1="32" y1="169" x2="972" y2="169" stroke="#233554" stroke-width="1"/>
  <text x="46" y="136" class="cell-bold">Code (.text)</text>
  <text x="266" y="136" class="cell-mono">78,242 Bytes</text>
  <text x="506" y="136" class="cell-mono">83,228 Bytes</text>
  <text x="746" y="136" class="cell">+4,986 Bytes (FreeRTOS kernel</text>
  <text x="746" y="154" class="cell">+ port asm)</text>
  <rect x="32" y="169" width="940" height="56" fill="#182540"/>
  <line x1="32" y1="225" x2="972" y2="225" stroke="#233554" stroke-width="1"/>
  <text x="46" y="192" class="cell-bold">Static RAM (.data + .bss)</text>
  <text x="266" y="192" class="cell-mono">43,972 Bytes</text>
  <text x="506" y="192" class="cell-mono">55,668 Bytes</text>
  <text x="746" y="192" class="cell">+11,696 Bytes (Task/ISR stacks</text>
  <text x="746" y="210" class="cell">&amp; TCBs)</text>
  <rect x="32" y="225" width="940" height="56" fill="#141f36"/>
  <line x1="32" y1="281" x2="972" y2="281" stroke="#233554" stroke-width="1"/>
  <text x="46" y="248" class="cell-bold">Application Task Stack</text>
  <text x="266" y="248" class="cell-mono">Unified startup stack (~2 KB)</text>
  <text x="506" y="248" class="cell-mono">8,192 Bytes (s_ax_stack static</text>
  <text x="506" y="266" class="cell-mono">pool)</text>
  <text x="746" y="248" class="cell">Dedicated task stack</text>
  <text x="746" y="266" class="cell">allocation</text>
  <rect x="32" y="281" width="940" height="56" fill="#182540"/>
  <line x1="32" y1="337" x2="972" y2="337" stroke="#233554" stroke-width="1"/>
  <text x="46" y="304" class="cell-bold">ISR Interrupt Stack</text>
  <text x="266" y="304" class="cell-mono">Reuses current stack</text>
  <text x="506" y="304" class="cell-mono">2,048 Bytes</text>
  <text x="506" y="322" class="cell-mono">(configISR_STACK_SIZE)</text>
  <text x="746" y="304" class="cell">Dedicated hardware trap stack</text>
  <rect x="32" y="337" width="940" height="38" fill="#141f36"/>
  <line x1="32" y1="375" x2="972" y2="375" stroke="#233554" stroke-width="1"/>
  <text x="46" y="360" class="cell-bold">Idle Task Stack</text>
  <text x="266" y="360" class="cell-mono">None (main loop sleeps in wfi)</text>
  <text x="506" y="360" class="cell-mono">1,024 Bytes (minimal stack)</text>
  <text x="746" y="360" class="cell">Static memory for idle loop</text>
  <rect x="32" y="375" width="940" height="56" fill="#182540"/>
  <line x1="32" y1="431" x2="972" y2="431" stroke="#233554" stroke-width="1"/>
  <text x="46" y="398" class="cell-bold">Heap Allocation</text>
  <text x="266" y="398" class="cell-mono">0 Bytes (zero heap</text>
  <text x="266" y="416" class="cell-mono">freestanding)</text>
  <text x="506" y="398" class="cell-mono">0 Bytes</text>
  <text x="506" y="416" class="cell-mono">(configSUPPORT_STATIC_ALLOCATION)</text>
  <text x="746" y="398" class="cell">Identical: 0 dynamic</text>
  <text x="746" y="416" class="cell">allocations</text>
</svg>
