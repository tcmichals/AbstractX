title: Architecture audit tiers
desc: Tier 1 repository inventory produces the master migration matrix for tier 2 SSOT and traceability audit, which produces the specification architecture for tier 3 observability and the Studio GUI framework.
grid: {col: 640, row: 110, gap_x: 60, gap_y: 70}
nodes:
  - id: t1
    label: "Tier 1: Repository Inventory, Deduplication & Taxonomy"
    text: ["Macro-structure & folder taxonomy",
           "Narrative deduplication across 35+ markdown files",
           "Target & BSP clean separation"]
    at: [0, 0]
  - id: t2
    label: "Tier 2: Specification-Driven (SSOT) & Traceability Audit"
    text: ["Markdown Drives Code (`[SPEC-*]` <-> `// @impl`) audit",
           "Freestanding C++20 zero-heap invariant enforcement",
           "Modular Spec Template (decoupling Core, Target, and App specs)"]
    at: [0, 1]
  - id: t3
    label: "Tier 3: Observability & AbstractX Studio GUI Framework"
    text: ["Two-Level Dear ImGui Studio Architecture (Core vs Plugins)",
           "Dynamic CTF 1.8 schema engine & MemBrowse memory integration",
           "AbstractX Studio Plugin SDK definition"]
    at: [0, 2]
    kind: accent
edges:
  - {from: t1, to: t2, label: "Produces: Master Migration Matrix"}
  - {from: t2, to: t3, label: "Produces: Specification Architecture"}
