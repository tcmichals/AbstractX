title: AbstractX Quality Gate Pipeline
desc: Pillar 1 CppUTest test-driven development feeds pillar 2, the 5-stage adversarial audit, which leads to automated merge or commit acceptance.
grid: {col: 620, row: 100, gap_x: 60, gap_y: 60}
nodes:
  - id: p1
    label: "Pillar 1: CppUTest Test-Driven Development (TDD)"
    text: ["Before writing or modifying any driver code, the AI must",
           "read the CppUTest test suite and mock contracts.",
           "The CppUTest test defines the unambiguous ground truth:",
           "mock register sequences, DRDY interrupts, and error states.",
           "Tests run natively on host (`ABSTRACTX_TARGET=host`).",
           "CppUTest MemoryLeakDetector asserts 0 bytes leaked."]
    at: [0, 0]
    span: [1, 1.3]
    kind: mem
  - id: p2
    label: "Pillar 2: 5-Stage Sashiko-Grade Adversarial Audit"
    text: ["The code diff is subjected to 5 distinct, isolated audit",
           "stages with zero tolerance for invariant violations:",
           "Stage 1: Zero-Heap & Freestanding Invariant Gate",
           "Stage 2: Non-Blocking HAL & Split-Transaction Gate",
           "Stage 3: ISR Domain & Coroutine Dispatcher Gate",
           "Stage 4: Hardware Endianness & Wire Framing Gate",
           "Stage 5: CppUTest Verification & Gatekeeper Verdict"]
    at: [0, 1.3]
    span: [1, 1.4]
    kind: warn
  - id: merge
    label: Automated Merge / Commit Acceptance
    at: [0, 2.7]
    span: [1, 0.7]
    kind: accent
edges:
  - {from: p1, to: p2}
  - {from: p2, to: merge}
