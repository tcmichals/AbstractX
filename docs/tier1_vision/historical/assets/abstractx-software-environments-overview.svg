<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374" role="img" aria-labelledby="t d">
<title id="t">One application API over three execution environments</title>
<desc id="d">A single-process, single-coroutine-thread application at the top reaches three execution environments (Linux host threaded I/O workers, multi-core MCU remote processor with interrupt/DMA, FPGA hardware offloader) through lock-free SPSC TLP message rings.</desc>
