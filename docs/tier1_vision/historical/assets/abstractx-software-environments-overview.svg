<rect x="30" y="94" width="840" height="90" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="450" y="126.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Unified top level: single process, single coroutine thread</text>
<text x="450" y="147.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">auto [sensor_a, sensor_b] = co_await when_all(read_a(), read_b());</text>
<text x="450" y="164.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Identical C++20 application code across all 3 environments</text>
<rect x="30" y="254" width="220" height="90" rx="12" fill="#1d1a3f" stroke="#b79cff" stroke-width="2"/>
<text x="140" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Environment 1</text>
<text x="140" y="299" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Linux / Host</text>
<text x="140" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Threaded I/O</text>
<text x="140" y="333" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Workers (SITL)</text>
<rect x="340" y="254" width="220" height="90" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="450" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Environment 2</text>
<text x="450" y="299" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Multi-Core MCU</text>
<text x="450" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Remote Proc /</text>
<text x="450" y="333" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Interrupt/DMA</text>
<rect x="650" y="254" width="220" height="90" rx="12" fill="#2a2416" stroke="#f5b942" stroke-width="2"/>
<text x="760" y="278" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Environment 3</text>
<text x="760" y="299" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">FPGA Hardware</text>
<text x="760" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Offloader &amp;</text>
<text x="760" y="333" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">On-Board Fabric</text>
<rect x="334.1" y="208.5" width="231.7" height="21" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="450" y="223.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">Lock-free SPSC TLP message rings</text>
