<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 522" width="1046" height="522" role="img" aria-labelledby="t d">
<title id="t">Microcontroller hardware topology matrix</title>
<desc id="d">Configuration A, single-core MCU (STM32G4/S3), a hardware DMA or peripheral ISR pushes into one lock-free SPSC ring in RAM that the main-loop coroutine task pops. Configuration B, dual-core AMP (RP2350/P4), Core 0 I/O coprocessor pushes into a shared-SRAM SPSC array that the Core 1 flight-loop task pops.</desc>
