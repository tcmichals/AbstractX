<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 454" width="1120" height="454" role="img" aria-labelledby="t d">
<title id="t">Dedicated lock-free SPSC channel array</title>
<desc id="d">Four background I/O worker threads (PCIe TLP, SPI IMU, I2C baro, ADC/mag) each push into their own SPSC queue; the main flight loop thread pops all four queues round-robin without blocking and is the only caller of resume().</desc>
