<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 624" width="880" height="624" role="img" aria-labelledby="t d">
<title id="t">How the smart I/O dispatcher works</title>
<desc id="d">The application coroutine thread sends 64-byte TLP-framed requests over lock-free SPSC to the smart I/O dispatcher and completion matching engine; the physical transport worker or hardware coprocessor layer sends completions back up to the dispatcher, which resumes coroutines on the main thread.</desc>
