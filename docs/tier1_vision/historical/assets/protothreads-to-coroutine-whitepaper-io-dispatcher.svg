<rect width="100%" height="100%" rx="18" fill="#0f1a30"/>
<text x="30" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f2f6ff" text-anchor="start">How the smart I/O dispatcher works</text>
<path d="M440 214 L440 284" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M440 474 L440 404" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<rect x="30" y="94" width="820" height="120" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="440" y="133" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Application coroutine thread</text>
<text x="440" y="154" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await io.async_push(TARGET, DATA); // Push-and-Forget</text>
<text x="440" y="171" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">auto res = co_await io.async_request(CMD); // Request-Response with correlated Tag</text>
<text x="440" y="188" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await timer.async_sleep_us(9040); // Hardware Comparator Sleep (0 Poll)</text>
<rect x="30" y="284" width="820" height="120" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="440" y="331.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Smart I/O dispatcher &amp; completion matching engine</text>
<text x="440" y="352.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Tag correlation: matches completion packets in 2-5 ns and resumes suspended</text>
<text x="440" y="369.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">coroutine handles strictly on the main thread (Rule 4.2: zero thread hopping).</text>
<rect x="30" y="474" width="820" height="120" rx="12" fill="#2a2416" stroke="#f5b942" stroke-width="2"/>
<text x="440" y="504.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Physical transport worker / hardware coprocessor layer</text>
<text x="440" y="525.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Linux SBC: background POSIX I/O thread pool (<tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">/dev/i2c-1</tspan>, <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">/dev/spidev0.0</tspan>)</text>
<text x="440" y="542.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Pico 2 (RP2350): Core 1 PIO/I2C state machine (SRAM SPSC rings)</text>
<text x="440" y="559.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">ESP32-P4/S3: dual-core RISC-V DMA interrupt engine</text>
<text x="440" y="576.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">FPGA: SystemVerilog autonomous Auto-DMA RTL (Tang Nano 9K / Primer 20K)</text>
<rect x="312.3" y="238.5" width="255.4" height="21" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="440" y="253.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">64-byte TLP framing / lock-free SPSC</text>
