<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 608" width="1140" height="608" role="img" aria-labelledby="t d">
<title id="t">One TLP bus, chip-specific hardware offload</title>
<desc id="d">Existing Betaflight, iNav and ArduPilot AP_HAL APIs sit on a uniform 64-byte PCIe-like TLP message bus, which fans out to RP2350, Allwinner Cubie A5E, STM32 and Linux/Jetson back ends, each driving the hardware offload and physical IO layer.</desc>
