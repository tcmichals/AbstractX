<text x="570" y="251.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Uniform 64-byte PCIe TLP message bus (tlp64_ring)</text>
<text x="570" y="272.2" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">MemRd (0x01), MemWr (0x02), CplD (0x03), DMA_Stream (0x10)</text>
