<text x="570" y="144.8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Preserves 100% backward compatibility with flight code and MSP/MAVLink</text>
