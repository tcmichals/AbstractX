<text x="523" y="347.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Physical hardware coprocessor layer</text>
<text x="523" y="368.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(Gowin FPGA / RP2350 Core 0 + PIO / STM32 TIM IC + MDMA streams)</text>
<text x="523" y="385.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Autonomous SPI sensor polling and 64-bit nanosecond hardware timestamping</text>
<text x="523" y="402.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Pushes ready 64-byte DMA_Stream TLPs into lock-free shared RAM rings</text>
<rect x="368.9" y="255" width="308.2" height="36" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="523" y="270" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">Lock-free 64B TLP shared memory rings</text>
<text x="523" y="285" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">(zero mutex locks, zero context switch stalls)</text>
