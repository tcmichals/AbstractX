<text x="523" y="177.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">24-state EKF matrix</text>
<text x="523" y="194.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Position/velocity calc</text>
<rect x="708" y="124" width="290" height="90" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
