<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 453" width="1046" height="453" role="img" aria-labelledby="t d">
<title id="t">ArduPilot threads over lock-free TLP rings</title>
<desc id="d">ArduPilot's main flight, EKF3 navigation and MAVLink/telemetry threads exchange TLPs with the physical hardware coprocessor layer through lock-free 64-byte TLP shared memory rings.</desc>
