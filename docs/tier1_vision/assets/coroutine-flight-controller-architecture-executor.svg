<text x="193" y="182.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await next_imu_stream()</text>
<text x="193" y="199.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">executes in 5 us, yields</text>
<rect x="398" y="124" width="290" height="100" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="543" y="161.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">50 Hz Baro Coroutine</text>
<text x="543" y="182.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await read_i2c(BARO)</text>
<text x="543" y="199.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">suspends for 1.5 ms</text>
<rect x="748" y="124" width="290" height="100" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="893" y="161.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">EKF Navigation Task</text>
<text x="893" y="182.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await when_all(</text>
<text x="893" y="199.5" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">read_baro(), read_mag())</text>
<rect x="48" y="294" width="990" height="83" rx="12" fill="#122b22" stroke="#4ade80" stroke-width="2"/>
<text x="543" y="323" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Lock-free SPSC 64-byte TLP ring buffers (SpscTlpRing)</text>
<text x="543" y="344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Host TX ring (MemRd / MemWr)</text>
<text x="543" y="361" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Host RX ring (CplD / DMA_Stream)</text>
<rect x="48" y="464" width="990" height="117" rx="12" fill="#2a2416" stroke="#f5b942" stroke-width="2"/>
<text x="543" y="501.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Hardware coprocessor / SITL I/O worker layer</text>
<text x="543" y="522.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">FPGA autonomous Auto-DMA engine (<tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">asp_imu_auto_dma.sv</tspan>)</text>
<text x="543" y="539.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">RP2350 PIO state machines and Core 0 DMA / STM32 BDMA stream controllers</text>
<text x="543" y="556.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Linux SITL: background I/O worker threads executing synchronous bus transfers</text>
