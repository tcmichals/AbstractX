<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1086 611" width="1086" height="611" role="img" aria-labelledby="t d">
<title id="t">Single-thread coroutine executor over TLP rings</title>
<desc id="d">Three coroutines on one main flight thread (8 kHz IMU, 50 Hz baro, EKF navigation task) issue TLPs into lock-free SPSC 64-byte TLP rings; the hardware coprocessor or SITL I/O worker layer streams TLPs to and from those rings without blocking.</desc>
