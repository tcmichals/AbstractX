<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 560" width="1142" height="560" role="img" aria-labelledby="t d">
<title id="t">AbstractX switch fabric top-level topology</title>
<desc id="d">A Dual-SPI or SPI translator core sends 64-byte TLPs over AXI-Stream to the AXI-Stream hub (channel/AXID router), which routes them to the Wishbone master gateway, the IMU Auto-DMA core and the UART ESC DMA tunnel, and feeds the egress TLP FIFO.</desc>
