<rect width="100%" height="100%" rx="18" fill="#0f1a30"/>
<text x="30" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f2f6ff" text-anchor="start">AbstractX three-layer architecture</text>
<path d="M390 224 L390 294" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M390 424 L390 494" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<rect x="30" y="94" width="720" height="130" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="390" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Layer 3: Application (C++20 stackless coroutines)</text>
<text x="390" y="159" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">100% portable code. Same source across MCU, Linux, and FPGA.</text>
<text x="390" y="176" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await io.async_read(REG_SENSOR)</text>
<text x="390" y="193" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">co_await when_all(read_imu(), read_baro())</text>
<rect x="30" y="294" width="720" height="130" rx="12" fill="#122b22" stroke="#4ade80" stroke-width="2"/>
<text x="390" y="346.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Layer 2: Message (64-byte Transaction Layer Packet, TLP)</text>
<text x="390" y="367.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Fixed-size PCIe-like packets. CRC32. Hardware nanosecond timestamps.</text>
<text x="390" y="384.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">MemRd / MemWr / CplD / DMA_Stream / DMA_Cfg</text>
<rect x="30" y="494" width="720" height="130" rx="12" fill="#2a2416" stroke="#f5b942" stroke-width="2"/>
<text x="390" y="538" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Layer 1: Transport (silicon and bus specific)</text>
<text x="390" y="559" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">FPGA: Dual-SPI 50 MHz / AXI-Stream crossbar (<tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">asp_router.sv</tspan>)</text>
<text x="390" y="576" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">MCU: core-to-core shared SRAM + hardware doorbells (SIO / IPC)</text>
<text x="390" y="593" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Linux: POSIX epoll / shared SRAM A3/C + msgbox mailboxes</text>
<rect x="312.7" y="248.5" width="154.6" height="21" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="390" y="263.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">Lock-free SPSC queues</text>
<rect x="296.3" y="448.5" width="187.3" height="21" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="390" y="463.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">Platform-specific transport</text>
</svg>
