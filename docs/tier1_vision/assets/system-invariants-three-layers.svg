<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 654" width="780" height="654" role="img" aria-labelledby="t d">
<title id="t">AbstractX three-layer architecture</title>
<desc id="d">Layer 3 application coroutines talk over lock-free SPSC queues to layer 2, fixed 64-byte TLP messages, which travel over a platform-specific layer 1 transport.</desc>
<defs>
<marker id="a42d8f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42d8f5"/></marker>
