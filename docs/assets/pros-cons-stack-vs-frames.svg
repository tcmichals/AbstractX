<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902.6 559" width="902.6" height="559" role="img" aria-labelledby="t d">
<title id="t">Memory footprint, RTOS multi-stack vs. single stack + coroutine frames</title>
<desc id="d">A traditional RTOS gives every task its own 2-8 KB stack; AbstractX runs all coroutines on one 1-2 KB processor stack with 64-128 B coroutine frames.</desc>
<defs>
<marker id="a42d8f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#42d8f5"/></marker>
<marker id="a42d8f5s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#42d8f5"/></marker>
<marker id="a4ade80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#4ade80"/></marker>
<marker id="a4ade80s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#4ade80"/></marker>
<marker id="a64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
<marker id="a64748bs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#64748b"/></marker>
<marker id="a7dd3fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7dd3fc"/></marker>
<marker id="a7dd3fcs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#7dd3fc"/></marker>
<marker id="a9fb3d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9fb3d9"/></marker>
<marker id="a9fb3d9s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#9fb3d9"/></marker>
<marker id="ab79cff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b79cff"/></marker>
<marker id="ab79cffs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#b79cff"/></marker>
<marker id="af5b942" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f5b942"/></marker>
<marker id="af5b942s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#f5b942"/></marker>
<marker id="af87171" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f87171"/></marker>
<marker id="af87171s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#f87171"/></marker>
</defs>
<rect width="100%" height="100%" rx="18" fill="#0f1a30"/>
<text x="30" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f2f6ff" text-anchor="start">Memory footprint, RTOS multi-stack vs. single stack + coroutine frames</text>
<rect x="12" y="64" width="846" height="118" rx="16" fill="#f87171" fill-opacity="0.05" stroke="#f87171" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="26" y="84" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="start" letter-spacing="1.2">TRADITIONAL RTOS ARCHITECTURE (HEAVY MULTI-STACK)</text>
<rect x="12" y="239" width="846" height="258" rx="16" fill="#42d8f5" fill-opacity="0.05" stroke="#42d8f5" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="26" y="259" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#42d8f5" text-anchor="start" letter-spacing="1.2">ABSTRACTX (SINGLE EXECUTION STACK + TINY COROUTINE FRAMES)</text>
<path d="M120 409 L120 339" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M330 409 L330 339" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M540 409 L540 339" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M750 409 L750 339" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<rect x="30" y="94" width="180" height="70" rx="12" fill="#2d1720" stroke="#f87171" stroke-width="2"/>
<text x="120" y="125" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Task 1 Stack</text>
<text x="120" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(2 - 8 KB)</text>
<rect x="240" y="94" width="180" height="70" rx="12" fill="#2d1720" stroke="#f87171" stroke-width="2"/>
<text x="330" y="125" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Task 2 Stack</text>
<text x="330" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(2 - 8 KB)</text>
<rect x="450" y="94" width="180" height="70" rx="12" fill="#2d1720" stroke="#f87171" stroke-width="2"/>
<text x="540" y="125" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Task 3 Stack</text>
<text x="540" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(2 - 8 KB)</text>
<rect x="660" y="94" width="180" height="70" rx="12" fill="#2d1720" stroke="#f87171" stroke-width="2"/>
<text x="750" y="125" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Task 4 Stack</text>
<text x="750" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(2 - 8 KB)</text>
<rect x="30" y="269" width="810" height="70" rx="12" fill="#122b22" stroke="#4ade80" stroke-width="2"/>
<text x="435" y="300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Single Processor Stack</text>
<text x="435" y="321" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(1 KB - 2 KB for all interrupts / calls)</text>
<rect x="30" y="409" width="180" height="70" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="120" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Coro 1 Frame</text>
<text x="120" y="461" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(64 - 128 B)</text>
<rect x="240" y="409" width="180" height="70" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="330" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Coro 2 Frame</text>
<text x="330" y="461" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(64 - 128 B)</text>
<rect x="450" y="409" width="180" height="70" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="540" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Coro 3 Frame</text>
<text x="540" y="461" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(64 - 128 B)</text>
<rect x="660" y="409" width="180" height="70" rx="12" fill="#14233f" stroke="#42d8f5" stroke-width="2"/>
<text x="750" y="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Coro 4 Frame</text>
<text x="750" y="461" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(64 - 128 B)</text>
<text x="30" y="515" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="start">RTOS result: 10 tasks = 20 KB to 80 KB of RAM locked in idle stacks + jitter.</text>
<text x="30" y="535" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="start">AbstractX result: 10 tasks = ~1 KB of coroutine frames. Up to 95% RAM savings.</text>
</svg>
