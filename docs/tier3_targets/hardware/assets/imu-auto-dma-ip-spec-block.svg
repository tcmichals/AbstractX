<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 450" width="1152" height="450" role="img" aria-labelledby="t d">
<title id="t">IMU SPI Master &amp; Auto-DMA IP</title>
<desc id="d">Inside the IP, an IMU_INT pulse from the external pin makes the hardware state machine latch the timestamp and execute an SPI burst through the SPI master core on the external SPI pins; the latched 64-bit timer goes to the 64-byte TLP stream generator, whose output feeds the transport FIFO on the Dual-SPI link.</desc>
