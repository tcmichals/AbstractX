title: AMP I/O switch architecture
desc: The application processor pushes 64-byte TLPs into a lock-free SPSC ring; the I/O processor dequeues them, decodes channel and BAR address and routes each to the UART/ESC, SPI/DMA or GPIO/LED IP.
grid: {col: 260, row: 80, gap_x: 60, gap_y: 70}
nodes:
  - id: app
    label: Application Processor (Core 1 / Linux)
    text: ["High-Speed Sensor Fusion Loop / Flight Control Math"]
    at: [0, 0]
    span: [3, 1]
    kind: accent
  - id: ring
    label: Lock-Free SPSC Ring (Shared SRAM / Mailbox)
    at: [0, 1]
    span: [3, 1]
    kind: mem
  - id: iop
    label: I/O Processor (Core 0 / XuanTie E906 / asp_router.sv)
    text: ["[ BUS SWITCH / ROUTER ]", "Decodes Channel & BAR Address -> Routes to Downstream IP"]
    at: [0, 2]
    span: [3, 1]
  - id: esc
    label: UART / ESC IP
    text: ["`bar::EscBase`"]
    at: [0, 3]
    kind: hw
  - id: spi
    label: SPI / DMA IP
    text: ["`bar::ImuBase`"]
    at: [1, 3]
    kind: hw
  - id: led
    label: GPIO / LED IP
    text: ["`bar::LedBase`"]
    at: [2, 3]
    kind: hw
edges:
  - {from: app, to: ring, label: "64-Byte TLP (target_address, tag)"}
  - {from: ring, to: iop, label: Dequeue TLP}
  - {from: iop, to: esc}
  - {from: iop, to: spi}
  - {from: iop, to: led}
