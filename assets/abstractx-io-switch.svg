<title id="t">AMP I/O switch architecture</title>
<desc id="d">The application processor pushes 64-byte TLPs into a lock-free SPSC ring; the I/O processor dequeues them, decodes channel and BAR address and routes each to the UART/ESC, SPI/DMA or GPIO/LED IP.</desc>
