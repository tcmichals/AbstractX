<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 244" width="980" height="244" role="img" aria-labelledby="t d">
<title id="t">Zynq-7020 Ethernet Telemetry to AbstractX Studio</title>
<desc id="d">The QMTECH Zynq-7020 target (Artix-7 PL auto-DMA 8 kHz IMU, Linux RT on dual Cortex-A9, gps_imu_app telemetry server) sends 64-byte TLP telemetry frames over UDP port 9870 to the host workstation running AbstractX Studio and the Flight Display.</desc>
