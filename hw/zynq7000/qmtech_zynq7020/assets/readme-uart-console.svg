<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 224" width="920" height="224" role="img" aria-labelledby="t d">
<title id="t">QMTECH Zynq-7020 USB Serial Console</title>
<desc id="d">The QMTECH carrier board's Micro-USB UART port (CP2102 or CH340 bridge to PS UART0) connects over a Micro-USB cable at 115200 baud 8N1 to the host workstation's /dev/ttyUSB0, opened with picocom or minicom.</desc>
