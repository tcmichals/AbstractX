<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 474" width="1050" height="474" role="img" aria-labelledby="t d">
<title id="t">Raspberry Pi Pico as Xilinx Virtual Cable (XVC)</title>
<desc id="d">A Raspberry Pi Pico running xvc-pico.uf2 drives the QMTECH Zynq-7020 14-pin JTAG header over 3.3V LVCMOS lines (GPIO 2-5 to TCK, TMS, TDI, TDO plus GND) and connects to the host workstation over USB CDC-ACM; the host runs xvcd-pico on TCP port 2542 for Vivado Hardware Manager.</desc>
