<rect width="100%" height="100%" rx="18" fill="#0f1a30"/>
<text x="30" y="52" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f2f6ff" text-anchor="start">Raspberry Pi Pico as Xilinx Virtual Cable (XVC)</text>
<path d="M360 164 L690 164" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M195 234 L195 304" fill="none" stroke="#9fb3d9" stroke-width="2" marker-end="url(#a9fb3d9)"/>
<path d="M855 234 L855 304" fill="none" stroke="#9fb3d9" stroke-width="2"/>
<rect x="30" y="94" width="330" height="140" rx="12" fill="#2a2416" stroke="#f5b942" stroke-width="2"/>
<text x="195" y="160" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Raspberry Pi Pico</text>
<text x="195" y="181" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">(Running <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">xvc-pico.uf2</tspan>)</text>
<rect x="690" y="94" width="330" height="140" rx="12" fill="#2a2416" stroke="#f5b942" stroke-width="2"/>
<text x="855" y="151.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">QMTECH Zynq-7020 Board (JTAG)</text>
<text x="855" y="172.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">14-pin Standard 2.0mm Header</text>
<text x="855" y="189.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">Bank 0 / JTAG Voltage: 3.3V</text>
<rect x="30" y="304" width="990" height="140" rx="12" fill="#1d1a3f" stroke="#b79cff" stroke-width="2"/>
<text x="525" y="353" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f6ff" text-anchor="middle">Host Workstation</text>
<text x="525" y="374" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">1. Runs <tspan font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace">xvcd-pico -s /dev/ttyACM0</tspan> (Opens TCP localhost:2542)</text>
<text x="525" y="391" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">2. Vivado Hardware Manager connects via "Add Xilinx Virtual Cable (XVC)"</text>
<text x="525" y="408" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#aebcda" text-anchor="middle">3. Inspects PL ILA signals &amp; Cortex-A9 DAP cores in real-time</text>
<rect x="397.3" y="65" width="255.4" height="96" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="525" y="80" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">JTAG 3.3V LVCMOS Lines</text>
<text x="525" y="95" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">GPIO 2 (Pin 4) -&gt; TCK (Pin 6)</text>
<text x="525" y="110" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">GPIO 3 (Pin 5) -&gt; TMS (Pin 4)</text>
<text x="525" y="125" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">GPIO 4 (Pin 6) -&gt; TDI (Pin 10)</text>
<text x="525" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">GPIO 5 (Pin 7) -&gt; TDO (Pin 8)</text>
<text x="525" y="155" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">GND (Pin 8) -&gt; GND (Pins 3, 5, 7, 9)</text>
<rect x="95.5" y="258.5" width="199" height="21" rx="5" fill="#0f1a30" fill-opacity="0.92"/>
<text x="195" y="273.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#aebcda" text-anchor="middle">USB CDC-ACM (/dev/ttyACM0)</text>
</svg>
