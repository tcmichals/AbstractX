title: Raspberry Pi Pico as Xilinx Virtual Cable (XVC)
desc: A Raspberry Pi Pico running xvc-pico.uf2 drives the QMTECH Zynq-7020 14-pin JTAG header over 3.3V LVCMOS lines (GPIO 2-5 to TCK, TMS, TDI, TDO plus GND) and connects to the host workstation over USB CDC-ACM; the host runs xvcd-pico on TCP port 2542 for Vivado Hardware Manager.
grid: {col: 330, row: 140, gap_x: 330, gap_y: 70}
nodes:
  - {id: pico, label: Raspberry Pi Pico, text: ["(Running `xvc-pico.uf2`)"], at: [0, 0], kind: hw}
  - {id: zynq, label: QMTECH Zynq-7020 Board (JTAG), text: ["14-pin Standard 2.0mm Header", "Bank 0 / JTAG Voltage: 3.3V"], at: [1, 0], kind: hw}
  - id: host
    label: "Host Workstation"
    text: ["1. Runs `xvcd-pico -s /dev/ttyACM0` (Opens TCP localhost:2542)",
           "2. Vivado Hardware Manager connects via \"Add Xilinx Virtual Cable (XVC)\"",
           "3. Inspects PL ILA signals & Cortex-A9 DAP cores in real-time"]
    at: [0, 1]
    span: [2, 1]
    kind: accent
edges:
  - from: pico
    to: zynq
    label: ["JTAG 3.3V LVCMOS Lines", "GPIO 2 (Pin 4) -> TCK (Pin 6)", "GPIO 3 (Pin 5) -> TMS (Pin 4)",
            "GPIO 4 (Pin 6) -> TDI (Pin 10)", "GPIO 5 (Pin 7) -> TDO (Pin 8)", "GND (Pin 8) -> GND (Pins 3, 5, 7, 9)"]
  - {from: pico, to: host, label: "USB CDC-ACM (/dev/ttyACM0)"}
  - {from: zynq, to: host, arrow: false}
