title: QMTECH Zynq-7020 USB Serial Console
desc: The QMTECH carrier board's Micro-USB UART port (CP2102 or CH340 bridge to PS UART0) connects over a Micro-USB cable at 115200 baud 8N1 to the host workstation's /dev/ttyUSB0, opened with picocom or minicom.
