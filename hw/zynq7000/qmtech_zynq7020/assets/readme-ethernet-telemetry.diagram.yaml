title: Zynq-7020 Ethernet Telemetry to AbstractX Studio
desc: The QMTECH Zynq-7020 target (Artix-7 PL auto-DMA 8 kHz IMU, Linux RT on dual Cortex-A9, gps_imu_app telemetry server) sends 64-byte TLP telemetry frames over UDP port 9870 to the host workstation running AbstractX Studio and the Flight Display.
