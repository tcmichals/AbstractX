# @impl [SPEC-AUDIT-09] [SPEC-AUDIT-13] docs/SPECTRACE.md
name: AbstractX SpecTrace Embedded Dashboard & Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # Required for updating RUNNING_PROFILE.md on main push
  pull-requests: write # Required for PR delta comment

jobs:
  spectrace-dashboard:
    name: SpecTrace Embedded Dashboard & Verification Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Build & Test Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip binutils
          python3 -m pip install pytest numpy

      - name: Build Host Verification Binaries & Suites
        run: |
          cmake --preset host
          cmake --build --preset host -j

      - name: Host Tests (All 35 Test Suites)
        run: |
          ctest --test-dir build_host --output-on-failure

      - name: ASan / UBSan Build & Test Gate
        run: |
          cmake -S . -B build_asan -DABSTRACTX_TARGET=host \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_asan -j
          ctest --test-dir build_asan --output-on-failure

      - name: SpecTrace Matrix & Evidence Verification
        run: |
          python3 tools/spectrace_matrix.py --matrix
          python3 tools/trac.py test --ctest debug=build_host --ctest asan=build_asan --matrix
          python3 tools/trac.py report

      - name: Export Benchmark JSON for GitHub Action Benchmark
        run: |
          python3 tools/trac.py export-benchmark --of size > benchmark_size.json
          python3 tools/trac.py export-benchmark --of test > benchmark_test.json

      - name: Publish Size Benchmark to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: AbstractX Static Size Metrics
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark_size.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: 'benchmarks_size'

      - name: Publish Test Execution Benchmark to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: AbstractX Test Execution Metrics
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark_test.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: 'benchmarks_test'

      - name: SpecTrace Parity Audit (100% SSOT Requirement Gate)
        run: |
          python3 tools/audit_specs.py

      - name: Adversarial Invariant Architecture Regression Suite
        run: |
          pytest tests/test_adversarial_invariants.py

      - name: Static Memory Footprint & Zero-Heap Symbol Audit
        run: |
          python3 tools/track_memory_membrowse.py

      - name: SpecTrace Embedded Dashboard & Running Profile Engine
        run: |
          python3 tools/track_quality_trends.py

      - name: Native GitHub PR SpecTrace & Memory Dashboard Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summaryFile = 'tools/visualizer/pr_comment.md';
            if (fs.existsSync(summaryFile)) {
              const body = fs.readFileSync(summaryFile, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.body.includes('AbstractX Continuous Quality & Verification Gate') || c.body.includes('SpecTrace Embedded Dashboard'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }
