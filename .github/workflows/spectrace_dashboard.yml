# @impl [SPEC-AUDIT-09] [SPEC-AUDIT-13] [SPEC-AUDIT-15] docs/SPECTRACE.md
name: AbstractX SpecTrace Embedded Dashboard & Quality Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # Required for updating RUNNING_PROFILE.md on main push
  pull-requests: write # Required for PR delta comment

jobs:
  spectrace-dashboard:
    name: SpecTrace Embedded Dashboard & Verification Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Build & Test Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip binutils clang-tidy verilator
          python3 -m pip install pytest numpy

      - name: Build Host Verification Binaries & Suites
        run: |
          cmake --preset host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build --preset host -j

      - name: Host Tests (All 35 Test Suites)
        run: |
          ctest --test-dir build_host --output-on-failure

      - name: ASan / UBSan Build & Test Gate
        run: |
          cmake -S . -B build_asan -DABSTRACTX_TARGET=host \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build_asan -j
          ctest --test-dir build_asan --output-on-failure

      # [SPEC-AUDIT-15] steps below are advisory until their first green run; each comment says
      # what it waits on. Remove continue-on-error then; never add it to a passing step.
      - name: TSan Build & Test Gate
        continue-on-error: true  # advisory: first TSan run in CI not yet triaged
        run: |
          cmake -S . -B build_tsan -DABSTRACTX_TARGET=host -DCMAKE_CXX_FLAGS="-fsanitize=thread -O1 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build_tsan -j
          ctest --test-dir build_tsan --output-on-failure

      - name: RTL Lint (Verilator)
        continue-on-error: true  # advisory: rtl-lint never run in CI; distro verilator vs oss-cad-suite
        run: |
          rc=0
          for f in rtl/*.sv rtl/*/*.sv; do
            [ -f "$f" ] || continue
            verilator --lint-only -Wall -Wno-DECLFILENAME -Wno-UNUSEDSIGNAL -Wno-UNUSEDPARAM \
              -Wno-PINCONNECTEMPTY -Irtl "$f" --top-module "$(basename "$f" .sv)" || rc=1
          done
          exit $rc

      - name: IPC Transport Invariant Audit
        continue-on-error: true  # advisory: audit_ipc_invariants.py added 2026-10-26, never run
        run: |
          python3 tools/audit_ipc_invariants.py

      - name: Static Analysis (clang-tidy)
        continue-on-error: true  # advisory: waits on the first triage and tools/static_analysis_baseline.txt
        run: |
          python3 tools/run_static_analysis.py --build-dir build_host -j 4

      - name: Test Claims (@verifies backed by @impl)
        continue-on-error: true  # advisory: --check-verifies added 2026-10-26, existing claims not triaged
        run: |
          python3 tools/spectrace_matrix.py --check-verifies

      - name: Shared-State Ownership Notes
        continue-on-error: true  # advisory: most shared globals have no '// shared:' note yet
        run: |
          python3 tools/boundary_review.py --check

      - name: SpecTrace Matrix & Evidence Verification
        run: |
          python3 tools/spectrace_matrix.py --matrix
          python3 tools/trac.py test --ctest debug=build_host --ctest asan=build_asan --matrix
          python3 tools/trac.py report

      - name: Export Benchmark JSON for GitHub Action Benchmark
        run: |
          python3 tools/trac.py export-benchmark --of size > benchmark_size.json
          python3 tools/trac.py export-benchmark --of test > benchmark_test.json

      - name: Publish Size Benchmark to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: AbstractX Static Size Metrics
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark_size.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: 'benchmarks_size'

      - name: Publish Test Execution Benchmark to GitHub Pages
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: AbstractX Test Execution Metrics
          tool: 'customSmallerIsBetter'
          output-file-path: benchmark_test.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          benchmark-data-dir-path: 'benchmarks_test'

      - name: SpecTrace Parity Audit (100% SSOT Requirement Gate)
        run: |
          python3 tools/audit_specs.py

      - name: Adversarial Invariant Architecture Regression Suite
        run: |
          pytest tests/test_adversarial_invariants.py

      - name: Static Memory Footprint & Zero-Heap Symbol Audit
        run: |
          python3 tools/track_memory_membrowse.py

      - name: SpecTrace Embedded Dashboard & Running Profile Engine
        run: |
          python3 tools/track_quality_trends.py

      - name: Native GitHub PR SpecTrace & Memory Dashboard Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summaryFile = 'tools/visualizer/pr_comment.md';
            if (fs.existsSync(summaryFile)) {
              const body = fs.readFileSync(summaryFile, 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.body.includes('AbstractX Continuous Quality & Verification Gate') || c.body.includes('SpecTrace Embedded Dashboard'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }
