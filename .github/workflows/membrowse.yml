name: MemBrowse Memory Observability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # Required for PR delta comments

jobs:
  membrowse-track:
    name: Track Firmware Footprint (${{ matrix.target_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: pico2w_rp2350
            preset: pico2w
            elf: build-pico2w/apps/gps_imu_app/gps_imu_app.elf
            map: build-pico2w/apps/gps_imu_app/gps_imu_app.elf.map
          - target_name: allwinner_e906
            preset: e906
            elf: build-e906/apps/gps_imu_app/gps_imu_app
            map: build-e906/apps/gps_imu_app/gps_imu_app.map

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Arm & RISC-V Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi gcc-riscv64-unknown-elf cmake ninja-build

      - name: Build Firmware (${{ matrix.preset }})
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --target gps_imu_app

      - name: Local Zero-Heap & Static Budget Audit
        run: |
          python3 tools/track_memory_membrowse.py

      - name: MemBrowse Action (Track & PR Comment)
        uses: membrowse/membrowse-action@main
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
        with:
          target_name: ${{ matrix.target_name }}
          elf: ${{ matrix.elf }}
          map_file: ${{ matrix.map }}
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
