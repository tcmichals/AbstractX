<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 747" width="1240" height="747" role="img" aria-labelledby="t d">
<title id="t">Linux Hybrid Reactor + Dedicated Bus Workers</title>
<desc id="d">The main epoll reactor (monitoring UART, GPIO DRDY and the RX eventfd) hands SPI and I2C requests to dedicated worker threads through etl::queue_spsc_isr rings plus an eventfd notify; the workers run blocking ioctl()s in parallel, and on completion notify_completion() via etl::delegate pushes a Tlp64 into g_rx_ring and notifies rx_eventfd, so the reactor wakes up and resumes the coroutine.</desc>
